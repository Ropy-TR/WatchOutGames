name = "watchout-games"
main = "src/worker.js"
compatibility_date = "2026-10-19"

[build]
command = "node scripts/check-release.mjs"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "LOBBIES"
class_name = "LobbyDirectory"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyDirectory"]
