<!doctype html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090909"><title>WatchOut Games</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <header class="topbar"><a class="brand" href="/">WatchOut<span>Games</span></a></header>
  <main>
    <section id="landing" class="landing">
      <h1>WatchOut Games</h1>
      <div class="room-card">
        <div class="tab-row"><button class="tab active" data-tab="join">Odaya katıl</button><button class="tab" data-tab="create">Oda oluştur</button></div>
        <form id="joinForm" class="room-form">
          <label>Takma ad<input id="joinNickname" maxlength="18" autocomplete="nickname" required></label>
          <label>Oda kodu<input id="joinCode" maxlength="5" autocomplete="off" autocapitalize="characters" required></label>
          <label>Şifre<input id="joinPassword" type="password" maxlength="32" required></label>
          <button class="primary-button" type="submit">Katıl</button>
        </form>
        <form id="createForm" class="room-form hidden">
          <label>Takma ad<input id="createNickname" maxlength="18" autocomplete="nickname" required></label>
          <label>Oda şifresi<input id="createPassword" type="password" maxlength="32" required></label>
          <button class="primary-button" type="submit">Oda oluştur</button>
        </form>
      </div>
    </section>
    <section id="room" class="room-view hidden">
      <div class="room-header"><button id="leaveRoom" class="subtle-button">Odadan çık</button><div class="room-code-box"><span>Oda</span><b id="roomCodeLabel">-----</b><button id="copyCode" aria-label="Oda kodunu kopyala">Kopyala</button></div><button id="shareRoom" class="subtle-button">Davet et</button></div>
      <div class="room-layout">
        <aside class="room-sidebar"><div class="sidebar-title"><h2>Oyuncular</h2><span id="playerCount">0 / 8</span></div><div id="playerList" class="player-list"></div></aside>
        <section class="room-main"><div id="roomNotice" class="notice hidden"></div>
          <div id="gamePicker" class="game-picker"><h1>Oyun seç</h1><div class="picker-grid">
            <button class="picker-card" data-game="spy">Spyfall</button><button class="picker-card" data-game="code">Codenames</button><button class="picker-card" data-game="city">İsim Şehir</button><button class="picker-card" data-game="xox">Futbol XOX</button>
          </div></div><div id="activeGame" class="active-game hidden"></div>
        </section>
      </div>
    </section>
  </main>
  <dialog id="playerDialog"><form id="playerSearchForm"><div class="game-title-row"><h2>Futbolcu seç</h2><button type="button" class="subtle-button" id="closePlayerDialog">Kapat</button></div><input id="playerSearch" type="search" placeholder="Futbolcu ara" autocomplete="off" aria-label="Futbolcu ara"><div id="playerResults" class="player-results"></div></form></dialog>
  <div id="toast" class="toast" role="status"></div><script src="/app.js"></script>
</body>
</html>
